<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowforge sounds</title>
<style>
  :root { --bg: #0d0a12; --panel: #1c1624; --ink: #efe9f6; --dim: #a59cb4; --accent: #e8b65c; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 20px 0 8px; color: var(--accent); }
  p.note { color: var(--dim); margin: 0 0 12px; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .clip { background: var(--panel); border-radius: 8px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; }
  .clip button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: #241a05; font-size: 16px; cursor: pointer; flex: none; }
  .clip .id { font-weight: 600; } .clip .meta { color: var(--dim); font-size: 12px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  label { color: var(--dim); }
</style>
</head>
<body>
<h1>Shadowforge sounds</h1>
<p class="note">Every clip in <code>data/audio-manifest.js</code>, played at its manifest gain, then every procedural Web Audio voice (the floor the game uses while a clip is missing). <strong>Not verified by ear.</strong></p>
<div class="bar"><label><input type="checkbox" id="useGain" checked> apply manifest gain</label><label><input type="checkbox" id="loop"> loop music</label><button id="stop">Stop all</button></div>
<div id="out"></div>
<script src="js/ns.js"></script>
<script src="data/audio-manifest.js"></script>
<script src="js/ui/core.js"></script>
<script src="js/ui/sound.js"></script>
<script>
(function () {
  if (!globalThis.SV || !SV.AUDIO) throw new Error('data/audio-manifest.js did not define SV.AUDIO');
  const out = document.getElementById('out');
  let playing = null;
  function stop() { if (playing) { playing.a.pause(); playing.btn.textContent = '▶'; playing = null; } }
  document.getElementById('stop').onclick = stop;
  function section(title) {
    const h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'grid'; out.appendChild(grid);
    return grid;
  }
  function row(grid, id, meta, onPlay) {
    const r = document.createElement('div'); r.className = 'clip';
    const btn = document.createElement('button'); btn.textContent = '▶'; btn.setAttribute('aria-label', 'Play ' + id);
    const txt = document.createElement('div');
    txt.innerHTML = '<div class="id"></div><div class="meta"></div>';
    txt.firstChild.textContent = id; txt.lastChild.textContent = meta;
    btn.onclick = function () { onPlay(btn, txt); };
    r.appendChild(btn); r.appendChild(txt); grid.appendChild(r);
  }
  for (const kind of ['sfx', 'music']) {
    const ids = Object.keys(SV.AUDIO[kind]);
    const grid = section((kind === 'sfx' ? 'Sound effects' : 'Music') + ' (' + ids.length + ' generated)');
    if (!ids.length) { const p = document.createElement('p'); p.className = 'note'; p.textContent = 'None generated yet.'; grid.appendChild(p); }
    for (const id of ids) {
      const e = SV.AUDIO[kind][id];
      const a = new Audio(e.src); a.preload = 'none';
      row(grid, id, 'gain ' + e.gain + (e.loop ? ' · loop' : '') + ' · ' + e.src, function (btn) {
        if (playing && playing.a === a) return stop();
        stop();
        a.volume = document.getElementById('useGain').checked ? Math.min(1, e.gain) : 1;
        a.loop = kind === 'music' && document.getElementById('loop').checked;
        a.currentTime = 0; a.play(); btn.textContent = '■'; playing = { a: a, btn: btn };
        a.onended = function () { if (playing && playing.a === a) stop(); };
      });
    }
  }
  const grid = section('Procedural voices (' + SV.sound.tags().length + ')');
  SV.sound.tags().forEach(function (tag) { row(grid, tag, 'Web Audio, js/ui/sound.js', function () { SV.sound.sfx(tag); }); });
})();
</script>
</body>
</html>
